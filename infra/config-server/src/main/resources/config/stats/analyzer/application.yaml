grpc:
  server:
    port: 0
spring:
  main:
    web-application-type: none
  datasource:
    driverClassName: "org.postgresql.Driver"
    url: "jdbc:postgresql://localhost:6541/stat"
    username: "stat"
    password: "stat"
  sql.init.mode: always

analyzer:
  kafka:
    close-timeout: 5000ms
    common-properties:
      "bootstrap.servers": "localhost:9092"
      "key.deserializer": "org.apache.kafka.common.serialization.VoidDeserializer"
      "enable.auto.commit": false
    consumers:
      - type: UserActionProcessor
        properties:
          "value.deserializer": "ru.yandex.practicum.kafka.serializer.UserActionDeserializer"
          "group.id": "stats.analyzer.action.group"
          "client.id": "analyzer.action.group.main"
        topics:
          - "stats.user-actions.v1"
        poll-timeout: 500ms
      - type: EventSimilarityProcessor
        properties:
          "value.deserializer": "ru.yandex.practicum.kafka.serializer.EventSimilarityDeserializer"
          "group.id": "stats.analyzer.similarity.group"
          "client.id": "analyzer.similarity.group.main"
        topics:
          - "stats.events-similarity.v1"
        poll-timeout: 500ms

    action-weight:
      view: 0.4
      registered: 0.8
      like: 1.0